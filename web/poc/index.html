<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Louie Web-UI · Proof of Concept</title>
<style>
/* ======================================================================
   Looping Louie WLAN-Upgrade · Web-UI Proof of Concept
   Eine Datei, keine Abhängigkeiten. Spezifikation: docs/web-ui-konzept.md
   ====================================================================== */
:root {
  --bg: #eef3f9; --surface: #ffffff; --s2: #f2f5fa; --text: #15202b; --muted: #556373;
  --line: #d4dce7; --accent: #5a3fe0; --accent-ink: #ffffff; --accent-soft: #ece8ff;
  --danger: #d4352a; --warn: #b97300; --ok: #1a8f4c; --sky: #d5e7fb; --tower: #8b97a6;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 6px 18px rgba(20,30,50,.08);
  --rot: #e0443a; --gelb: #e8b100; --gruen: #23a055; --blau: #2f7de1;
  --r: 16px; --page: #d9e1ea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #18212c; --s2: #1f2a36; --text: #eaf0f6; --muted: #9aa8b8;
    --line: #2c3a49; --accent: #8f7bff; --accent-ink: #120c2e; --accent-soft: #2a2550;
    --danger: #f2655a; --warn: #f0aa3a; --ok: #43c97d; --sky: #1b2b3e; --tower: #6c7a8b;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
    --page: #0a0e13;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #18212c; --s2: #1f2a36; --text: #eaf0f6; --muted: #9aa8b8;
  --line: #2c3a49; --accent: #8f7bff; --accent-ink: #120c2e; --accent-soft: #2a2550;
  --danger: #f2655a; --warn: #f0aa3a; --ok: #43c97d; --sky: #1b2b3e; --tower: #6c7a8b;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
  --page: #0a0e13;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page); color: var(--text);
  font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ===================== Testumgebung (Desktop) ===================== */
#env { display: flex; min-height: 100vh; }
#sim {
  width: 318px; flex: none; background: #1d2430; color: #e7ecf3; padding: 12px; display: flex; flex-direction: column; gap: 12px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; font-size: 14px;
  border-right: 6px solid; border-image: repeating-linear-gradient(45deg, #f2b705 0 10px, #1d2430 10px 20px) 6;
}
#sim h1 { font-size: 15px; margin: 0; letter-spacing: .02em; display: flex; gap: 8px; align-items: center; }
#sim h1 small { font-weight: 400; color: #9fb0c3; font-size: 12px; }
#sim .sbox { background: #262f3d; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
#sim .sbox > b { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #9fb0c3; }
#sim .srow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#sim button { background: #354155; color: #e7ecf3; border: 0; border-radius: 9px; padding: 7px 10px; font-size: 13px; }
#sim button:hover { background: #42506a; }
#sim button.on { background: #f2b705; color: #1d2430; font-weight: 700; }
#sim input[type=range] { flex: 1; accent-color: #f2b705; }
#leverBtn {
  width: 100%; min-height: 64px; font-size: 20px !important; font-weight: 800; border-radius: 14px !important;
  display: flex; align-items: center; justify-content: center; gap: 12px; background: #3a2b2b !important; border: 2px solid #6b4040 !important;
}
#leverBtn.on { background: #1f4d33 !important; border-color: #3fbf7a !important; }
#leverBtn svg { flex: none; }
#topview { width: 100%; height: auto; background: #151b24; border-radius: 12px; display: block; }
#log { max-height: 260px; overflow: auto; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; background: #11161d; border-radius: 8px; padding: 6px; }
#log div { white-space: pre-wrap; word-break: break-all; padding: 1px 0; border-bottom: 1px solid #1c232d; }
#log .in { color: #9fd3ff; } #log .out { color: #b9f0c4; } #log .hw { color: #ffd479; } #log .err { color: #ff9c94; }
#sim details summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #9fb0c3; font-weight: 700; }
#sim .hint { color: #9fb0c3; font-size: 12px; }
#simToast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #f2b705; color: #1d2430; padding: 8px 14px; border-radius: 10px; font-weight: 700; z-index: 50; display: none; font-size: 14px; }

#phones { flex: 1; display: flex; flex-wrap: wrap; gap: 22px; padding: 18px; align-content: flex-start; }
.pwrap { display: flex; flex-direction: column; gap: 6px; }
.pctl { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.pctl b { color: var(--text); flex: 1; font-size: 14px; }
.pctl button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 5px 8px; font-size: 12px; }
.pctl button.off { background: color-mix(in srgb, var(--danger) 18%, var(--surface)); }
.addphone { width: 375px; height: 720px; border: 3px dashed var(--line); border-radius: 34px; display: grid; place-items: center; color: var(--muted); background: transparent; font-size: 18px; margin-top: 28px; }

/* Schmale Bildschirme: nur ein Handy im Vollbild */
#mbar { display: none; }
@media (max-width: 699px) {
  #env { display: block; }
  #sim { display: none; position: fixed; inset: 44px 0 0 0; width: auto; height: auto; z-index: 40; border-right: 0; border-top: 6px solid; }
  #sim.open { display: flex; }
  #mbar { display: flex; position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 41; background: #1d2430; color: #e7ecf3; gap: 6px; align-items: center; padding: 0 6px;
    border-bottom: 3px solid; border-image: repeating-linear-gradient(45deg, #f2b705 0 8px, #1d2430 8px 16px) 3; font-size: 13px; }
  #mbar select, #mbar button { background: #354155; color: #e7ecf3; border: 0; border-radius: 8px; height: 32px; padding: 0 8px; font-size: 13px; }
  #mbar button.on { background: #1f7a48; }
  #mbar select { flex: 1; min-width: 0; }
  #phones { padding: 0; gap: 0; display: block; padding-top: 44px; }
  .pwrap { display: none; }
  .pwrap.active { display: block; }
  .pctl, .addphone { display: none; }
  .phone { width: 100vw !important; height: calc(100dvh - 44px) !important; border-radius: 0 !important; border: 0 !important; }
}

/* ===================== Handy-Rahmen ===================== */
.phone {
  width: 375px; height: 720px; border-radius: 34px; overflow: hidden; position: relative; background: var(--bg);
  border: 8px solid #10151b; box-shadow: 0 10px 40px rgba(0,0,0,.25); container-type: size; container-name: phone;
}
.app { position: absolute; inset: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 52px; flex: none; }
.brand { font-weight: 800; flex: 1; display: flex; align-items: center; gap: 6px; font-size: 17px; white-space: nowrap; overflow: hidden; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 4px 9px; border-radius: 999px; background: var(--s2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.role { color: var(--text); font-weight: 700; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); display: inline-block; flex: none; }
.dot.off { background: var(--danger); }
.banner { padding: 7px 12px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex: none; border-bottom: 1px solid var(--line); min-height: 48px; }
.banner > span { flex: 1; line-height: 1.25; }
.banner.req { background: var(--accent-soft); }
.banner.warn { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); }
.banner.bad { background: color-mix(in srgb, var(--danger) 18%, var(--surface)); }
.banner .btn { min-height: 40px; padding: 0 12px; font-size: 14px; width: auto; }
.banner.owner { background: repeating-linear-gradient(45deg, color-mix(in srgb, #f2b705 25%, var(--surface)) 0 10px, var(--surface) 10px 20px); min-height: 36px; font-weight: 700; }

main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.page { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.page.scroll { overflow-y: auto; }
.page.scroll > * { flex-shrink: 0; }
.page.game { justify-content: space-between; }
.nav { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); flex: none; height: 64px; }
.nav button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
.nav button .i { font-size: 22px; line-height: 1; }
.nav button.on { color: var(--accent); }
.nav button.on .i { transform: scale(1.12); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow); }
.card h2 { margin: 0; font-size: 17px; }
h1.pt { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }
.btn {
  border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 14px;
  min-height: 52px; padding: 0 16px; width: 100%; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.btn.sec { background: var(--s2); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.ok { background: var(--ok); color: #fff; }
.btn.sm { min-height: 44px; font-size: 15px; width: auto; padding: 0 12px; border-radius: 12px; }
.btn.xl { min-height: 72px; font-size: 20px; border-radius: 18px; }
.btn:disabled, .btn.dis { opacity: .45; }
.btn .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,255,255,.35); pointer-events: none; }
.btn.sec .fill { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.back { border: 0; background: transparent; color: var(--accent); font-weight: 700; min-height: 48px; padding: 0 4px; display: inline-flex; align-items: center; gap: 4px; font-size: 16px; align-self: flex-start; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; flex: none; }
.li { display: flex; gap: 12px; align-items: center; min-height: 58px; padding: 8px 14px; border: 0; background: transparent; text-align: left; border-bottom: 1px solid var(--line); width: 100%; }
.li:last-child { border-bottom: 0; }
.li .ic { font-size: 24px; width: 32px; text-align: center; flex: none; }
.li .t { flex: 1; min-width: 0; }
.li .t b { display: block; }
.li .t span { font-size: 13px; color: var(--muted); }
.li .chev { color: var(--muted); font-size: 20px; }
.li.workshop { background: repeating-linear-gradient(45deg, color-mix(in srgb, #f2b705 22%, var(--surface)) 0 10px, var(--surface) 10px 20px); }

/* Schalter (echte Bedienelemente) */
.sw { display: flex; align-items: center; gap: 10px; min-height: 48px; border: 0; background: transparent; width: 100%; padding: 0; text-align: left; }
.sw .t { flex: 1; font-weight: 600; }
.sw .k { width: 52px; height: 32px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.sw .k::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.sw.on .k { background: var(--ok); }
.sw.on .k::after { transform: translateX(20px); }
.sw.dis { opacity: .5; }

.seg { display: flex; gap: 4px; background: var(--s2); padding: 4px; border-radius: 14px; border: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; min-height: 44px; font-weight: 600; font-size: 14px; padding: 0 4px; }
.seg button.on { background: var(--surface); box-shadow: var(--shadow); color: var(--accent); }

input.field, select.field { width: 100%; min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 17px; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 36px; }
.rl { display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; }
.rl output { color: var(--accent); }

/* Status, Hebel-Spiegel, Orbit */
.status { display: flex; gap: 12px; align-items: center; }
.stitle { font-size: 22px; font-weight: 800; line-height: 1.15; }
.orbit { width: 78px; height: 78px; border-radius: 50%; background: var(--sky); position: relative; flex: none; }
.orbit .arm { position: absolute; inset: 0; }
.orbit .tw { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px; border-radius: 50%; background: var(--tower); }
.orbit svg { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); }
.mirror { flex: none; width: 62px; text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .03em; }
.mirror svg { display: block; margin: 0 auto 2px; }
.mirror.wiggle svg { animation: wig .45s infinite; }
@keyframes wig { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }

/* Modus-Karte, Fiesheit */
.mcard { display: flex; gap: 12px; align-items: center; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; text-align: left; width: 100%; min-height: 64px; }
.mcard .mi { font-size: 34px; line-height: 1; flex: none; }
.mcard.on { border-color: var(--accent); }
.mcard.locked { opacity: .5; }
.mcard .t { flex: 1; min-width: 0; }
.mcard .t b { display: block; font-size: 17px; }
.mcard .t span { font-size: 13px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.need { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.fies { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.fies button { min-height: 52px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 2px; }
.fies button small { font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.fies button.on { border-color: var(--accent); background: var(--accent-soft); }
.fies button.lock { opacity: .35; }

/* Spieler-Chips */
.seats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.seat { border-radius: 14px; padding: 6px 2px; text-align: center; color: #fff; position: relative; min-height: 64px; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.seat .ck { font-size: 14px; letter-spacing: -2px; }
.seat .nm { font-size: 12px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 3px; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.seat .ph { position: absolute; top: 2px; right: 4px; font-size: 11px; }
.seat.inactive { filter: grayscale(1); opacity: .35; }
.seat.out { filter: grayscale(.8); opacity: .6; }
.c-rot { background: var(--rot); } .c-gelb { background: var(--gelb); } .c-gruen { background: var(--gruen); } .c-blau { background: var(--blau); }
.t-rot { color: var(--rot); } .t-gelb { color: var(--gelb); } .t-gruen { color: var(--gruen); } .t-blau { color: var(--blau); }

/* Runde */
.slim { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; min-height: 52px; }
.icon48 { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--s2); font-size: 20px; display: grid; place-items: center; flex: none; }
.speedbox { text-align: center; }
.speednum { font-size: min(96px, 14cqh); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.speednum small { font-size: .35em; font-weight: 800; color: var(--muted); letter-spacing: 0; }
.speednum.rev { color: var(--danger); }
.gauge { height: 14px; border-radius: 99px; background: var(--s2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.gauge i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); border-radius: 99px; }
.gauge i.rev { background: var(--danger); }
.gauge b { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--text); opacity: .5; }
.ticker { display: flex; flex-direction: column; gap: 4px; height: 100px; overflow: hidden; flex: none; }
.ticker.short { height: 68px; }
.tick { font-size: 14px; padding: 5px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); animation: pop .3s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
.tick:not(.new) { animation: none; }
.tick:first-child { font-weight: 700; }
@keyframes pop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tile { border: 0; border-radius: 14px; color: #fff; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 800; }
.tile .ck { font-size: 16px; letter-spacing: -2px; }
.tile .nm { font-size: 12px; text-shadow: 0 1px 1px rgba(0,0,0,.35); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 3px; }
.tile .m1 { font-size: 11px; opacity: .9; }
.tile.out { filter: grayscale(.7); opacity: .65; }
.tile.inactive { filter: grayscale(1); opacity: .25; }
.botbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lockchip { display: none; align-self: center; background: var(--danger); color: #fff; font-weight: 800; padding: 6px 14px; border-radius: 99px; font-size: 15px; }
.lockchip.on { display: inline-block; }

/* Gamepad */
.pad { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 0; }
.big {
  width: min(230px, 34cqh); height: min(230px, 34cqh); border-radius: 50%; border: 0; position: relative; user-select: none; -webkit-user-select: none; touch-action: none; flex: none;
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--danger) 65%, #fff) 0%, var(--danger) 62%);
  color: #fff; box-shadow: 0 10px 30px color-mix(in srgb, var(--danger) 40%, transparent), inset 0 -6px 0 rgba(0,0,0,.15);
  display: grid; place-items: center; text-align: center;
}
.big.boost { background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--accent) 60%, #fff) 0%, var(--accent) 62%); box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 40%, transparent), inset 0 -6px 0 rgba(0,0,0,.15); }
.big.ghost { background: radial-gradient(circle at 50% 38%, #c9c2ff 0%, #6a5acd 62%); }
.big.dis { filter: grayscale(.9); opacity: .55; }
.big.locked { background: radial-gradient(circle at 50% 38%, #888 0%, #555 62%); box-shadow: 0 0 0 6px var(--danger); }
.big:active:not(.dis) { transform: scale(.97); }
.big .lbl { font-size: min(26px, 4cqh); font-weight: 900; letter-spacing: .02em; line-height: 1.1; }
.big .em { font-size: min(48px, 7cqh); line-height: 1; }
.big .sub { font-size: 14px; opacity: .95; margin-top: 2px; font-weight: 600; }
.big svg.ring { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); transform: rotate(-90deg); pointer-events: none; overflow: visible; }
.tokens { display: flex; gap: 8px; justify-content: center; min-height: 16px; }
.tokens i { width: 16px; height: 16px; border-radius: 50%; background: var(--danger); }
.tokens i.used { background: var(--line); }
.tokens.boost i { background: var(--accent); }
.tokens.boost i.used { background: var(--line); }
.padinfo { font-weight: 700; min-height: 22px; text-align: center; }
.mine { display: flex; gap: 8px; align-items: center; }
.mine .chips { font-size: 26px; letter-spacing: -3px; }
.edge { position: absolute; inset: 0; pointer-events: none; z-index: 8; display: none; box-shadow: inset 0 0 0 10px var(--danger); animation: blink .25s infinite alternate; }
.edge.on { display: block; }
@keyframes blink { to { box-shadow: inset 0 0 0 4px var(--danger); } }

/* Overlays, Sheets, Toast */
.overlay { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(3px); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
.count { font-size: min(180px, 26cqh); font-weight: 900; line-height: 1; animation: zoom .9s ease-out; }
@keyframes zoom { from { transform: scale(1.8); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); } }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 11; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 22px 22px 0 0; padding: 16px 14px 18px; z-index: 12; box-shadow: 0 -10px 30px rgba(0,0,0,.2); display: flex; flex-direction: column; gap: 10px; max-height: 92%; overflow-y: auto; }
.sheet.full { top: 0; border-radius: 0; max-height: none; justify-content: center; }
.toast { position: absolute; left: 12px; right: 12px; top: 58px; z-index: 20; background: #1b2330; color: #fff; border-radius: 14px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.3); animation: pop .25s ease; }
.toast.bad { background: #8f1f18; }
.toast.good { background: #14613a; }
.toast span { flex: 1; }
.toast button { background: rgba(255,255,255,.18); border: 0; color: #fff; border-radius: 10px; min-height: 40px; padding: 0 12px; font-weight: 700; }


.qr { background: #fff; border-radius: 12px; padding: 10px; display: inline-block; }
.hand { display: inline-block; animation: tap 1.2s infinite; }
@keyframes tap { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
.steps { text-align: left; display: grid; gap: 10px; }
.step { display: flex; gap: 10px; align-items: flex-start; }
.step .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.wdots { display: flex; gap: 6px; justify-content: center; }
.wdots i { width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
.wdots i.on { background: var(--accent); }
.choice { display: grid; gap: 8px; }
.choice button { min-height: 64px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); display: flex; gap: 12px; align-items: center; padding: 8px 14px; text-align: left; font-weight: 700; }
.choice button.on { border-color: var(--accent); background: var(--accent-soft); }
.choice button .em { font-size: 30px; }
.choice button small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.colors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; min-height: 0; }
.colors button { border: 0; border-radius: 20px; color: #fff; font-weight: 800; font-size: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 100px; position: relative; }
.colors button .ck { font-size: 28px; letter-spacing: -4px; }
.colors button.taken { filter: grayscale(1); opacity: .45; }
.colors button.me { box-shadow: 0 0 0 4px var(--text); }
.colors button small { font-size: 13px; font-weight: 600; }
.mydisc { width: min(170px, 26cqh); height: min(170px, 26cqh); border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: min(40px, 6cqh); letter-spacing: -6px; margin: 0 auto; box-shadow: var(--shadow); }
.facts { display: grid; gap: 6px; font-size: 14px; }
.facts div { display: flex; gap: 8px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv div { background: var(--s2); border-radius: 12px; padding: 8px 10px; }
.kv b { display: block; font-size: 18px; }
.kv span { font-size: 12px; color: var(--muted); }
.striped { border: 6px solid; border-image: repeating-linear-gradient(45deg, #f2b705 0 10px, #1d2430 10px 20px) 6; }
.curve { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-right: 4px; }
.legend i.d { border-top: 2px dashed var(--muted); }
.legend i.c { border-top: 2px solid var(--danger); }
.result .win { font-size: 24px; font-weight: 900; }
.titles { display: grid; gap: 6px; }
.titles div { display: flex; gap: 8px; align-items: center; background: var(--s2); border-radius: 12px; padding: 6px 10px; font-size: 14px; }
.titles div .em { font-size: 22px; }
.spin { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: rot 0.8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.okmark { color: var(--ok); font-weight: 800; } .badmark { color: var(--danger); font-weight: 800; }
.bigemoji { font-size: min(64px, 10cqh); line-height: 1; }
/* Korrekturrunde 1 */
.tile .n { font-size: 24px; font-weight: 900; line-height: 1.1; letter-spacing: -1px; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.stack { display: flex; flex-direction: column; align-items: center; line-height: 1.1; position: relative; }
.stack small { font-weight: 500; font-size: 12px; opacity: .9; }
.banner.win { background: color-mix(in srgb, #f2b705 35%, var(--surface)); font-size: 17px; min-height: 52px; }
.techcard { border: 3px solid var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
.techt { font-size: 20px; font-weight: 900; color: var(--danger); }
.mybar { color: #fff; font-weight: 800; padding: 4px 12px; font-size: 14px; flex: none; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.slim.mybar2 { color: #fff; border-bottom: 0; text-shadow: 0 1px 1px rgba(0,0,0,.35); }

.page.game.mycol { box-shadow: inset 0 0 0 6px var(--my); }
.outbar { background: #2a2140; color: #fff; font-weight: 800; padding: 6px 12px; font-size: 14px; flex: none; }
.sticky { position: sticky; bottom: -12px; background: var(--bg); padding: 8px 0 12px; margin-top: auto; z-index: 3; box-shadow: 0 -8px 12px -8px rgba(0,0,0,.15); }
.mcard.two .t span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.list.compact .li { min-height: 50px; padding: 4px 12px; }
.list.compact .li .t span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill.owner { background: repeating-linear-gradient(45deg, color-mix(in srgb, #f2b705 40%, var(--surface)) 0 8px, var(--surface) 8px 16px); border-color: #c99400; min-height: 32px; font-size: 12px; padding: 4px 8px; }
button.pill { cursor: pointer; }
.btn.grow { flex: 1; width: auto; }
main.b2 .big { width: min(180px, 26cqh); height: min(180px, 26cqh); }
main.b2 .ticker.short { height: 36px; }
main:is(.b1,.b2) .result .tiny { display: none; } main.b2 .titles div:nth-child(n+3) { display: none; } main.b2 .result .bigemoji { display: none; }
main.b2 .banner .tiny { display: none; }
main.b2 .page.game { gap: 5px; }
/* Runde 2: Joker-Gamepad, Baukasten */
.j-rew { --jc: var(--danger); } .j-bst { --jc: var(--ok); } .j-brk { --jc: #e07a00; } .j-fak { --jc: #8b5cf6; }
.big.j-bst { background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--ok) 60%, #fff) 0%, var(--ok) 62%); box-shadow: 0 10px 30px color-mix(in srgb, var(--ok) 40%, transparent), inset 0 -6px 0 rgba(0,0,0,.15); }
.big.j-brk { background: radial-gradient(circle at 50% 38%, #ffc27a 0%, #e07a00 62%); }
.big.j-fak { background: radial-gradient(circle at 50% 38%, #c9b5ff 0%, #8b5cf6 62%); }
.pads2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; flex: 1; min-height: 0; position: relative; max-height: 380px; }
.jbtn { position: relative; overflow: hidden; border: 0; border-radius: 22px; color: #fff; background: var(--jc); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; user-select: none; -webkit-user-select: none; touch-action: none; min-height: 150px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.15); }
.pads2.ghost .jbtn { background: linear-gradient(160deg, #6a5acd, var(--jc)); }
.jbtn.dis { filter: grayscale(.85); opacity: .55; } .jbtn.locked { filter: grayscale(.9); box-shadow: 0 0 0 5px var(--danger) inset; }
.jbtn .jem { font-size: min(52px, 8cqh); line-height: 1; position: relative; } .jbtn .jl { font-weight: 900; font-size: 18px; position: relative; letter-spacing: .03em; }
.jbtn .ji { font-size: 13px; font-weight: 700; position: relative; min-height: 18px; } .jbtn .tokens { position: relative; } .jbtn .tokens i { background: #fff; } .jbtn .tokens i.used { background: rgba(255,255,255,.3); }
.jbtn .vfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(255,255,255,.35); pointer-events: none; }
.jbtn .cdbar { position: absolute; left: 0; right: 0; top: 0; height: 0; background: rgba(0,0,0,.35); pointer-events: none; }
.shareddots { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--surface); border-radius: 99px; padding: 6px 10px; box-shadow: var(--shadow); }
.seat.win { box-shadow: 0 0 0 3px #f2b705; }
.mrow { display: flex; gap: 6px; align-items: stretch; } .mrow .mcard { flex: 1; min-width: 0; } .copybtn { height: auto; min-height: 48px; }
.edpage { padding-top: 0; }
.edhead { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 6px 0 6px; display: flex; flex-direction: column; gap: 4px; margin: 0 -2px; }
.edtitle { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.edpv { padding: 6px 8px; gap: 4px; display: flex; flex-direction: column; }
.fies.mini button { min-height: 40px; font-size: 18px; }
.edcard { padding: 0; overflow: hidden; } .edc { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; padding: 10px 12px; min-height: 58px; }
.edc .ic { font-size: 24px; } .edc .t { flex: 1; min-width: 0; } .edc .t b { display: block; } .edc .t span { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.edcard .sl { padding: 0 12px 10px; }
.ehint { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; font-size: 13px; background: var(--s2); }
.ehint > span { flex: 1; } .ehint.red { background: color-mix(in srgb, var(--danger) 18%, var(--surface)); } .ehint.yellow { background: color-mix(in srgb, #f2b705 25%, var(--surface)); } .ehint.green, .ehint.ok { background: color-mix(in srgb, var(--ok) 15%, var(--surface)); }
.hintline { border: 0; background: transparent; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; width: 100%; }
.stp { display: flex; align-items: center; gap: 6px; min-height: 48px; } .stp .stv { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
.stp .btn.sm { min-width: 44px; padding: 0; }
input[type=range].neg { accent-color: var(--danger); }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.moreb { border: 0; background: transparent; color: var(--accent); font-weight: 700; min-height: 44px; text-align: left; padding: 0 2px; }
.segcard { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; }
.segmain { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; border: 0; background: transparent; text-align: left; min-height: 52px; }
.segn { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
.segi { font-size: 18px; width: 30px; text-align: center; flex: none; } .segmain .t { flex: 1; min-width: 0; } .segmain .t b { display: block; font-size: 14px; } .segmain .t span { font-size: 12px; color: var(--muted); }
.segmenu { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; }
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gtile { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; min-height: 96px; }
.gtile.j-rew, .gtile.j-bst, .gtile.j-brk, .gtile.j-fak { border-color: var(--jc); } .gtile.dis { opacity: .45; }
.jgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.jtile .stp { gap: 3px; min-height: 44px; } .jtile .stv { min-width: 28px; } .jtile .stp .btn.sm { min-width: 40px; } .jtile .stp .grow { display: none; } .jtile .stp > span:first-child:not(:empty) { display: inline; font-size: 12px; }
.jtile { border: 2px solid var(--jc); border-radius: 14px; padding: 6px 8px; background: var(--surface); }
.ftab { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; } .ftab label { display: flex; flex-direction: column; align-items: center; font-size: 16px; }
.ftab input, .prow input { width: 100%; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); text-align: center; font-size: 14px; padding: 0 2px; }
input.auto { color: var(--muted); } input.own { color: var(--text); font-weight: 800; border-color: var(--accent); }
.prow { display: grid; grid-template-columns: 92px repeat(5, 1fr) 40px; gap: 3px; align-items: center; } .prow .pl { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow.phead span { text-align: center; } .prow .btn.sm { min-height: 40px; padding: 0; }
textarea.field { min-height: 80px; padding: 8px; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
.emojis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; } .emojis button { min-height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-size: 20px; padding: 0; }
.emojis button.on { border-color: var(--accent); background: var(--accent-soft); }
/* Runde 3: optionale Farben, bis 8 Mitspieler */
:root { --lila: #8b5cf6; --orange: #f97316; --tuerkis: #0fb5ae; --pink: #ec4899; }
.c-lila { background: var(--lila); } .c-orange { background: var(--orange); } .c-tuerkis { background: var(--tuerkis); } .c-pink { background: var(--pink); }
.t-lila { color: var(--lila); } .t-orange { color: var(--orange); } .t-tuerkis { color: var(--tuerkis); } .t-pink { color: var(--pink); }
.c-none, .neutral { background: var(--surface); color: var(--text) !important; border: 2px solid var(--line) !important; text-shadow: none !important; }
.seat.c-none .nm, .tile.c-none .nm, .tile.c-none .m1 { text-shadow: none; color: var(--text); }
.mydisc.neutral { font-size: min(56px, 8cqh); letter-spacing: 0; }
.mybar.neutral { color: var(--text); text-shadow: none; border-width: 0 0 1px 0 !important; }
.slim.mybar2.neutral { color: var(--text); text-shadow: none; background: var(--surface); }
.slim.mybar2.neutral .icon48 { background: var(--s2); border-color: var(--line); color: var(--text); }
.nametag { display: inline-flex; align-items: center; gap: 5px; background: var(--s2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-weight: 800; color: var(--text); text-shadow: none; }
.slim.mybar2:not(.neutral) .nametag { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.45); color: #fff; }
.nametag.ntbig { font-size: 22px; padding: 4px 12px; border-radius: 12px; }
.cdot { display: inline-block; border-radius: 50%; vertical-align: middle; margin-right: 5px; flex: none; }
.cdot.none { border: 2px dashed var(--line); background: transparent; }
.seats.many, .tiles.many { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.seats.many .seat { min-height: 38px; padding: 2px 3px; flex-direction: row; gap: 2px; } .seats.many .seat .ck { font-size: 11px; letter-spacing: 0; } .seats.many .seat .nm { font-size: 12px; }
main:is(.b1,.b2) .page.game.manyp .mcard .t span { display: none; } main:is(.b1,.b2) .page.game.manyp .mcard { min-height: 46px; } main.b2 .page.game.manyp .card .hdr { display: none !important; }
.page.game.manyp .orbit { display: none; } .page.game.manyp .stitle { font-size: 19px; } .page.game.manyp { gap: 8px; }
.tiles.many .tile { min-height: 56px; } .tiles.many .tile .n { font-size: 18px; } .tiles.many .tile .m1 { display: none; }
.nochips { padding: 6px 2px; }
.specpage { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--muted) 6%, transparent) 0 12px, transparent 12px 24px); }
.pill.spec, .specbox { border-style: dashed; color: var(--muted); }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.sw8 { min-height: 52px; border-radius: 12px; border: 3px solid transparent; color: #fff; font-weight: 900; font-size: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.sw8 small { font-size: 10px; font-weight: 700; text-shadow: 0 1px 1px rgba(0,0,0,.4); } .sw8.on { border-color: var(--text); }
.sw8.none { background: var(--surface); color: var(--text); border: 2px dashed var(--line); } .sw8.none.on { border: 3px solid var(--text); } .sw8.none small { text-shadow: none; }
.leadseg button { font-size: 13px; white-space: nowrap; padding: 0 2px; }
.linkbtn { border: 0; background: transparent; color: var(--muted); font-size: 13px; text-decoration: underline; min-height: 44px; align-self: center; }
.evestat { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--muted); } .evestat span { white-space: nowrap; }
.tick.leadonly { opacity: .65; font-weight: 400 !important; font-style: italic; }
.arow { display: grid; grid-template-columns: 58px 1fr; gap: 4px 6px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.arow select:nth-of-type(2), .arow select:nth-of-type(3) { grid-column: 1 / -1; }
select.field.sm { min-height: 44px; font-size: 15px; padding: 0 8px; }
.keysvis { display: flex; gap: 10px; justify-content: center; } .keysvis span { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; }
.keysvis span.lit { background: var(--ok); color: #fff; border-color: var(--ok); }
.pulse { animation: pulse 1s infinite; } @keyframes pulse { 50% { transform: scale(1.15); } }

function makeRun(mode, o) {

    if (shared ? b.total >= Math.round(fv(J.shared_count, o.fies)) : (b.used[j.kind] || 0) >= cnt) return false;
    if (shared && j.max != null && (b.used[j.kind] || 0) >= j.max) return false;
    if (run.t < (b.cd[key2] || 0)) return false;
    if (j.from_s && run.t < j.from_s) return false;

/* Validierung mit Hinweisen: gelb = wird angepasst, rot = kann nicht gespeichert werden, grün = Info */
function validateMode(m, ctx) {
  const H = [], segs = m.flight.segments, L = ctx.limits;

  if (m.jokers.items.length > 3) H.push({ lvl: 'red', text: 'Höchstens 3 Joker-Arten pro Modus.' });
  for (const st of [false, true]) {
    const n = m.jokers.items.filter(j => j.who === 'all' || (st ? j.who === 'out' : j.who === 'alive')).length;
    if (n > 2) H.push({ lvl: 'red', text: `Höchstens 2 Joker-Knöpfe gleichzeitig (${st ? 'Geister' : 'Aktive'}: ${n}). Tipp: gemeinsames Konto.`, fix: { act: 'shared' } });
  }
  segs.forEach((s, i) => { if (!isFinite(segDur(s)) && i < segs.length - 1) H.push({ lvl: 'red', text: `„${SEG[s.type].name}“ (Abschnitt ${i + 1}) läuft endlos, die Abschnitte danach kommen nie. Dauer setzen?`, fix: { act: 'finite', i } }); });
  if (pv.stats.sollRevShare > L.revShare + 0.5) {

  }
  else if (pv.stats.sollRevShare > 0.2) H.push({ lvl: 'green', text: `Rückwärtsanteil ${Math.round(pv.stats.sollRevShare)} % – passt (Grenze ${L.revShare} %).` });
  if (pv.stats.maxBurst > L.revMax + 0.05) H.push({ lvl: 'yellow', text: `${pv.stats.maxBurst.toFixed(1).replace('.', ',')} s rückwärts am Stück – erlaubt ${String(L.revMax).replace('.', ',')} s, Louie hält danach an.` });

  if (maxPlan > ctx.cap) H.push({ lvl: 'yellow', text: `Im Profil ${ctx.profileName} höchstens ${ctx.cap} % – die Spitzen werden gekappt.` });
  if (modeNeedsOut(m)) H.push({ lvl: 'green', text: '👻 Geister-Joker und „letzter Spieler“ wirken nur mit „📊 Statistik & Ausscheiden“ (Steuerhandy → Spieler & Handys).' });

/* ---------- Funk-Taster: Geräte (dauerhaft, Besitzer) und Eingänge am Spieler (Abend, Leiter) ---------- */
const DEV_MODELS = { button1: { name: 'Shelly BLU Button1', tech: 'bthome', keys: 1, delay: 350 }, rc4: { name: 'Shelly BLU RC Button 4', tech: 'bthome', keys: 4, delay: 350 },

const EV_NAME = { press: 'einfach', double: 'doppelt', long: 'lang' };
const RSSI_MIN = -70;
function devLabel(id) { const d = S.devices.find(x => x.id === id); return d ? d.label : '?'; }
function inputOwner(dev, key, ev) { for (let i = 0; i < S.seats.length; i++) { const inp = S.seats[i].inputs.find(n => n.dev === dev && n.key === key && n.ev === ev); if (inp) return { i, inp }; } return null; }
/* Funk-Paket vom (simulierten) Taster: addr, model, Taste, Ereignis, Signal, Batterie */
function radioEvent(pkt) {
  log('hw', 'Funk', { t: 'hw', radio: pkt.addr, key: pkt.key, ev: pkt.ev, rssi: pkt.rssi, bat: pkt.bat });
  const d = S.devices.find(x => x.addr === pkt.addr);
  const L = S.learn;
  if (d) {
    d.last = { bat: pkt.bat, rssi: pkt.rssi, seen: now() };
    if (L && L.step === 'keys' && L.found && L.found.addr === pkt.addr) { if (!L.keysSeen.includes(pkt.key)) L.keysSeen.push(pkt.key); return; }
    if (S.phase === 'sleep') return;
    const o = inputOwner(d.id, pkt.key, pkt.ev);
    if (!o) { if (inRound()) event('button_free', {}, `🔘 ${d.label} Taste ${pkt.key} (${EV_NAME[pkt.ev]}) ist keinem Spieler zugeordnet`, null, true); return; }
    const x = S.seats[o.i];
    if (o.inp.action === 'out') { if (!outEff()) { event('button_rej', {}, `🔘 ${x.name}: „Ich bin raus“ – Statistik ist aus`, x.color, true); return; } const r = setOut(null, o.i, true); if (!r.ok) event('button_rej', {}, `🔘 ${x.name}: ${r.reason}`, x.color, true); return; }
    if (o.inp.action !== 'j1' && o.inp.action !== 'j2') return;
    if (!inRound()) return;
    const md = S.runMode, items = jokerItemsFor(md, x.out), j = items[o.inp.action === 'j1' ? 0 : 1];
    if (!j) { event('button_rej', {}, `🔘 ${x.name}: kein ${o.inp.action === 'j1' ? '1.' : '2.'} Joker in diesem Modus`, x.color, true); return; }
    const r = jokerUse(o.i, j.kind, 'button');
    if (!r.ok) event('button_rej', {}, `🔘 ${x.name}: ${jokerLabel(j).icon} abgelehnt – ${r.reason}`, x.color, true);
    return;
  }
  // unbekanntes Gerät
  if (L && L.found && L.found.addr === pkt.addr && ['found', 'keys'].includes(L.step)) { if (!L.keysSeen.includes(pkt.key)) L.keysSeen.push(pkt.key); return; }
  if (L && L.step === 'wait' && now() < L.until) {
    if (pkt.rssi < RSSI_MIN) { L.weak = (L.weak || 0) + 1; return; }
    L.found = { addr: pkt.addr, model: pkt.model, tech: DEV_MODELS[pkt.model].tech, keys: DEV_MODELS[pkt.model].keys, rssi: pkt.rssi, bat: pkt.bat };
    L.keysSeen = [pkt.key]; L.step = 'found'; event('learn', { found: pkt.addr });

H.learn_start = sid => { const e = needAdmin(sid); if (e) return no(e); S.learn = { by: sid, until: now() + 30000, step: 'wait', found: null, keysSeen: [], weak: 0 }; return ok(); };

/* Belegung: rows = [{key, ev, pid | 'new' | '', action: j1|j2|out|none, name?}] */
H.assign_inputs = (sid, m) => {
  if (!isLeader(sid) && !isAdmin(sid)) return no('Nur Steuerhandy oder Besitzer');
  const d = S.devices.find(x => x.id === m.dev); if (!d) return no('Unbekanntes Gerät');
  const rows = (m.rows || []).filter(r => r.pid && r.action && r.action !== 'none');
  const seen = new Set();
  for (const r of rows) { const k = r.key + ':' + r.ev; if (seen.has(k)) return no(`Taste ${r.key} (${EV_NAME[r.ev]}) ist doppelt belegt`); seen.add(k); if (r.action === 'out' && !outEff()) return no('„Ich bin raus“ nur mit Statistik & Ausscheiden'); }
  const newKeys = [...new Set(rows.filter(r => r.pid.startsWith('new')).map(r => r.pid))];
  const willFree = S.seats.filter(x => !x.sid && x.inputs.length && x.inputs.every(n => n.dev === d.id) && !rows.some(r => r.pid === x.pid)).length;
  if (S.seats.length - willFree + newKeys.length > S.maxPlayers) return no(`Zu viele Spieler (Spielerzahl ${S.maxPlayers})`);
  for (const x of S.seats) x.inputs = x.inputs.filter(n => n.dev !== d.id);
  const made = {};
  for (const nk of newKeys) { const nm = (rows.find(r => r.pid === nk).name || DICE[Math.floor(Math.random() * DICE.length)]).slice(0, 20); const x = newSeat({ name: nm, joinNext: inRound() }); S.seats.push(x); made[nk] = x.pid; event('join', { pid: x.pid }, `🔘 ${x.name} spielt mit Taster mit`, null); }
  for (const r of rows) { const pid = made[r.pid] || r.pid; const x = S.seats.find(y => y.pid === pid); if (x) x.inputs.push({ dev: d.id, key: r.key, ev: r.ev, action: r.action }); }
  S.seats = S.seats.filter(x => x.sid || x.inputs.length);
  return ok();
};

/* ---------- Takt ---------- */
function tick(dt) {
  if (S.learn && S.learn.step === 'wait' && now() > S.learn.until) S.learn.step = 'timeout';
  const t = now();
  if (S.sleepWarnUntil && inRound()) S.sleepWarnUntil = 0;
  if (S.sleepWarnUntil && t >= S.sleepWarnUntil) goSleep();
  if (S.leaderPrio && t >= S.leaderPrio.until) {
    const ps = SESS.get(S.leaderPrio.sid); if (ps && !ps.connected) ps.wasLeader = true;
    S.leaderPrio = null;
    if (!S.leader && S.policy === 'jeder') { const f = [...SESS.values()].find(x => x.connected); if (f) { S.leader = f.sid; event('lead', { sid: f.sid }, `👑 ${f.name} steuert`); } }
  }
  if (S.phase === 'countdown' && t >= S.countdownEnd) {
    if (S.resuming && RUN) { S.resuming = false; S.phase = 'running'; event('resume', {}, '▶️ Weiter geht’s'); } else beginRunning();
  }
  if (S.phase === 'running' && RUN) {
    RUN.step(dt / 1000);
    S.speed = RUN.out; S.soll = RUN.soll; S.label = RUN.label;
    const tl = endTime(S.runMode);
    if (tl && RUN.t >= tl) endRound(`Zeit um (${fmtClock(tl)} min)`);
    else if (S.runMode.end.plan_end && RUN.planEnded) endRound('Flugplan zu Ende');
    S.battery = Math.max(0, S.battery - dt / 1000 * 0.004 * Math.abs(S.speed) / 50);
    if (S.battery < 5) endRound('Akku leer – Runde sauber beendet', true);
  } else if (S.probe) {
    const p = S.probe;
    if (p.kind !== 'dir' && realNow() - p.hb > T.HB * 1.6) stopProbe('losgelassen');
    else if (t > p.until) stopProbe(p.kind === 'probe' ? '10 s vorbei' : p.kind === 'dir' ? null : 'Zeit um');
    else if (p.kind === 'probe') { p.run.step(dt / 1000); S.speed = p.run.out; S.soll = p.run.soll; S.label = '▶️ Probefahrt'; }
    else { S.speed = p.kind === 'dir' ? 25 : p.raw; S.soll = S.speed; S.label = p.kind === 'dir' ? '🧭 Drehrichtung' : p.kind === 'max' ? '🌀 Fliehkraft-Test' : '🐢 Mindesttempo-Test'; }
  } else if (S.ws) {
    const w = S.ws;
    if (realNow() - w.hb > T.HB * 1.6) stopWs('Totmannknopf losgelassen');
    else if (t > w.until) stopWs('60 s erreicht');
    else { w.run.step(dt / 1000 * w.rate); S.speed = w.run.out; S.soll = w.run.soll; S.label = w.run.label || '🔧 Werkstatt'; }
  } else if (!S.setupDone && S.setup && S.lever && [2, 3, 4].includes(S.setup.step)) {
    S.speed = S.setup.step === 2 ? 25 : S.setup.step === 3 ? S.setup.minTry : S.setup.maxTry; S.soll = S.speed;
    S.label = S.setup.step === 2 ? '🧭 Drehrichtung' : S.setup.step === 3 ? '🐢 Mindesttempo' : '🌀 Fliehkraft-Grenze';
  } else { S.speed = 0; S.soll = 0; S.label = ''; }
  // Verwaiste Plätze freigeben
  for (const x of S.seats) if (x.sid && x.keepUntil && x.keepUntil !== Infinity && t > x.keepUntil) {
    event('seat_free', { pid: x.pid }, `📵 ${x.name} getrennt – Platz wieder frei`, x.color);
    if (x.inputs.length) { x.sid = null; x.keepUntil = 0; if (S.leader && !SESS.get(S.leader)) S.leaderPlays = false; } else x.gone = true;
  }
  if (S.seats.some(x => x.gone)) { for (const x of S.seats.filter(y => y.gone)) removeSeat(S.seats.indexOf(x)); }
  // Verwaiste Steuerung melden (einmal)
  const oa = orphanAt();
  if (oa && t >= oa && !S.orphanNoted) { S.orphanNoted = true; event('lead_orphan', { sid: S.leader }, `📵 Steuerhandy ${sessName(S.leader)} weg – Steuerung übernehmen?`); }
  if (!oa) S.orphanNoted = false;
  // Anfragen: Zeitablauf → Hebel-Bestätigung
  for (const r of [...S.requests]) {
    if (r.kind === 'lead' && r.status === 'pending' && between() && (r.direct || t - r.at > T.REQ || leaderFree())) {
      if (S.requests.some(x => x.status === 'lever')) continue; // immer nur ein Fenster
      r.status = 'lever'; r.leverUntil = t + T.LEVER_WIN; r.flips = [];
      deliver(r.from, { t: 'info', text: r.direct ? 'Bestätige mit dem Hebel' : 'Keine Antwort – bestätige mit dem Hebel' });
    } else if (r.kind === 'lead' && r.status === 'lever' && t > r.leverUntil) {
      S.requests = S.requests.filter(x => x !== r); deliver(r.from, { t: 'err', reason: 'Zeit für Hebel-Bestätigung abgelaufen' });
      if (S.lever && between()) S.leverNeedsOff = true;
    } else if (r.kind === 'join' && between() && t - r.at > T.JOIN_TIMEOUT) {
      S.requests = S.requests.filter(x => x !== r); deliver(r.from, { t: 'err', reason: 'Keine Antwort vom Steuerhandy – frag nochmal' });
    }
    if (!SESS.get(r.from) || !SESS.get(r.from).connected) S.requests = S.requests.filter(x => x !== r);
  }
  // Besitzer-Leerlauf
  for (const [sid, last] of Object.entries(S.admins)) if (t - last > T.ADMIN_IDLE) { delete S.admins[sid]; deliver(sid, { t: 'info', text: '🔒 Besitzer-Sitzung nach 5 min Leerlauf beendet' }); }
  // WLAN-Test
  if (S.wifiTest && t > S.wifiTest.until && S.wifiTest.result == null) {
    S.wifiTest.result = S.wifiTest.ok;
    if (S.wifiTest.ok && !S.wifi.some(w => w.ssid === S.wifiTest.ssid)) S.wifi.push({ ssid: S.wifiTest.ssid, prio: S.wifi.length + 1 });
    if (!S.wifiTest.ok) S.errors.push({ t, text: `WLAN ${S.wifiTest.ssid}: Anmeldung fehlgeschlagen` });
  }
  for (const k of Object.keys(S.undo)) if (t > S.undo[k].until) delete S.undo[k];
  if (S.testMode && t > S.testMode.until) endTest('Probefahrt-Bereitschaft abgelaufen (60 s)');
}

  else if (msg.t === 'event') {

const PLANE = c => `<path d="M0,-14 L3,-4 L14,-1 L14,3 L3,2 L2,9 L6,12 L6,14 L0,13 L-6,14 L-6,12 L-2,9 L-3,2 L-14,3 L-14,-1 L-3,-4 Z" fill="${c}"/><circle cy="-5" r="3.2" fill="#ffd27a" stroke="#7a4b00" stroke-width=".8"/>`;

function chicks(n, out) { if (out) return '👻'; return '🐔'.repeat(Math.max(0, n)) + `<span style="opacity:.28">${'🐔'.repeat(Math.max(0, 3 - n))}</span>`; }
function sw(label, on, act, arg, why) {

function holdBtn(act, label, ms, cls, arg, opt = {}) {

function fiesRow(cur, max, act, why) {

    const lock = n > max;

  }).join('')}</div>`;
}
function needText(m) { return modeNeedsPhones(m) ? '📱 je Spieler ein Handy' : 'kein Handy nötig'; }
function curveSvg(pv, o = {}) {
  const w = o.w || 330, h = o.h || 130, mini = !!o.mini;
  const pl = mini ? 1 : 28, pr = mini ? 1 : 6, pt = mini ? 2 : (o.marks === false ? 8 : 16), pb = mini ? 2 : 18;
  const ymin = -60, ymax = 110;
  const n = pv.out.length;
  const X = i => pl + i / Math.max(1, n - 1) * (w - pl - pr);
  const XT = t => pl + clamp(t / pv.dur, 0, 1) * (w - pl - pr);
  const Y = v => pt + (ymax - clamp(v, ymin, ymax)) / (ymax - ymin) * (h - pt - pb);
  const line = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  // Soll nur dort gestrichelt, wo geklemmt wird
  let sollP = '', revP = '';
  for (let i = 0; i < n; i++) {
    if (pv.clamp && pv.clamp[i]) sollP += `${(i && pv.clamp[i - 1]) ? 'L' : 'M'}${X(i).toFixed(1)},${Y(pv.soll[i]).toFixed(1)}`;
    if (pv.out[i] < -0.5) revP += `${(i && pv.out[i - 1] < -0.5) ? 'L' : 'M'}${X(i).toFixed(1)},${Y(pv.out[i]).toFixed(1)}`;
  }
  if (!pv.clamp) sollP = line(pv.soll);
  const capY = Y(pv.cap), zY = Y(0), y100 = Y(100);
  let g = '';
  if (o.hl) g += `<rect x="${XT(o.hl[0])}" y="${pt}" width="${Math.max(2, XT(Math.min(o.hl[1], pv.dur)) - XT(o.hl[0]))}" height="${h - pt - pb}" fill="color-mix(in srgb, var(--accent) 12%, transparent)"/>`;
  if (!mini) {
    g += `<text x="2" y="${y100 + 4}" font-size="10" fill="var(--muted)">100</text><text x="2" y="${zY + 4}" font-size="10" fill="var(--muted)">0</text><text x="2" y="${Y(-45) + 4}" font-size="10" fill="var(--danger)">rück</text>`;
    g += `<text x="${pl}" y="${h - 4}" font-size="10" fill="var(--muted)">0:00</text><text x="${w - pr}" y="${h - 4}" font-size="10" fill="var(--muted)" text-anchor="end">${fmtClock(pv.dur)}</text>`;
    if (pv.cap < 100) g += `<text x="${w - pr - 2}" y="${capY - 3}" font-size="10" fill="var(--danger)" text-anchor="end">max. ${pv.cap} %</text>`;
    if (o.marks !== false) {
      const seen = {};
      for (const mk of (pv.marks || []).slice(0, 80)) { const x = XT(mk.t), k = Math.round(x / 9) + mk.icon; if (seen[k]) continue; seen[k] = 1; g += `<text x="${x}" y="11" font-size="10" text-anchor="middle">${mk.icon}</text>`; }
      for (const t of (pv.kicks || []).slice(0, 40)) g += `<text x="${XT(t)}" y="${Y(-55)}" font-size="9" text-anchor="middle" fill="var(--danger)">▼</text>`;
    }
  }
  const cur = o.cursor != null ? `<line data-live="${o.cursorKey || 'cursor'}" data-x0="${pl}" data-w="${w - pl - pr}" data-dur="${pv.dur}" x1="${pl}" x2="${pl}" y1="${pt}" y2="${h - pb}" stroke="var(--text)" stroke-width="2"/>` : '';
  return `<svg class="curve" viewBox="0 0 ${w} ${h}" ${mini ? `width="${w}" height="${h}" style="width:${w}px;flex:none"` : ''} role="img" aria-label="Tempo-Verlauf">
    <rect x="${pl}" y="${zY}" width="${w - pl - pr}" height="${h - pb - zY}" fill="color-mix(in srgb, var(--danger) 7%, transparent)"/>
    ${g}
    <line x1="${pl}" x2="${w - pr}" y1="${zY}" y2="${zY}" stroke="var(--line)" stroke-width="1"/>
    ${pv.cap < 100 ? `<line x1="${pl}" x2="${w - pr}" y1="${capY}" y2="${capY}" stroke="var(--danger)" stroke-width="1" stroke-dasharray="4 3" opacity=".8"/>` : ''}
    ${mini ? '' : `<path d="${sollP}" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3"/>`}
    <path d="${line(pv.out)}" fill="none" stroke="var(--accent)" stroke-width="${mini ? 1.6 : 2.2}" stroke-linejoin="round"/>
    ${revP ? `<path d="${revP}" fill="none" stroke="var(--danger)" stroke-width="${mini ? 1.6 : 2.6}"/>` : ''}
    ${cur}</svg>`;
}

function qrSvg(text, size = 180) {
  const N = 25, R = rng(text); let cells = '';
  const fin = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#111"/>`;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if ((x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9)) continue;
    if (R() < 0.48) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<div class="qr"><svg width="${size}" height="${size}" viewBox="-1 -1 ${N + 2} ${N + 2}" role="img" aria-label="QR-Code (Platzhalter)"><rect x="-1" y="-1" width="${N + 2}" height="${N + 2}" fill="#fff"/><g fill="#111">${cells}</g>${fin(0, 0)}${fin(N - 7, 0)}${fin(0, N - 7)}</svg></div>`;
}

    else out.push(`<div class="banner warn"><span>🕹️ Hebel bestätigt gerade <b>${esc(lw.fromName)}</b> als Steuerer (<b data-until="${lw.leverUntil}"></b>) – nicht starten!</span>${r.lead ? `<button class="btn sm sec" data-act="cancelReq" data-arg="${lw.id}">Abbrechen</button>` : ''}</div>`);

function viewWorkshop(P, s, r) {

  const tabs = `<div class="seg">${[['dry', '🧪 Trocken'], ['real', '⚡ Echt'], ['cal', '🧭 Kalibrierung']].map(([id, t]) => `<button class="${W.tab === id ? 'on' : ''}" data-act="wstab" data-arg="${id}">${t}</button>`).join('')}</div>`;

      <div class="kv"><div><b>${Math.round(st.avg)} %</b><span>Ø Tempo</span></div><div><b>${st.revShare.toFixed(1).replace('.', ',')} %</b><span>Rückwärtsanteil (Grenze ${s.limits.revShare} %)</span></div>
        <div><b>${st.evPerMin.toFixed(1).replace('.', ',')}</b><span>Ereignisse pro Minute</span></div><div><b>${st.est ? fmtClock(st.est) : '> ' + fmtClock(pv.dur)}</b><span>geschätzte Rundendauer</span></div>

      ${holdBtn('ws', mine ? '✋ Motor läuft – halten!' : '✋ Totmannknopf: gedrückt halten', 0, 'xl ' + (can ? 'danger' : 'dis'), '', { dead: true, why: can ? null : 'Bedingungen oben nicht erfüllt', aria: 'Totmannknopf' })}

      ${calibCard(P, s, 'min', can, false)}${calibCard(P, s, 'max', can, false)}
      <div class="tiny muted">Während du „Halten zum Testen“ drückst, kannst du mit − / + oder dem Regler nachstellen. Weitere Schritte (Spürbarkeit der Ruckler, Leerlaufstrom) folgen im echten Gerät.</div>`;
  }
  return `<div class="page scroll striped" data-scroll="ws"><button class="back" data-act="back">‹ Besitzer</button><h1 class="pt">🔧 Werkstatt</h1>${tabs}${body}</div>`;

  } else if (id === 'gross') {
    S.maxPlayers = 8;
    const p = addPhone('Papa'); send(p, { t: 'select_mode', id: 'duell' }); send(p, { t: 'leader_plays', on: true, color: 'rot' });
    const cols = ['rot', 'blau', 'blau', null, 'gruen', null, 'lila'];
    ['Lena', 'Max', 'Oma', 'Mia', 'Tim', 'Ida', 'Ben'].forEach((n, i) => { const q = addPhone(n); send(q, { t: 'join_play', name: n, color: cols[i] }); });
    p.ui.toast = null;
  } else if (id === 'gast') {
    const p = addPhone('Papa'); setLever(true); broadcastState(); addPhone('Gast');
  } else if (id === 'geister') {
    const p = addPhone('Papa'); send(p, { t: 'select_mode', id: 'letztes' }); send(p, { t: 'allow_players', on: true }); send(p, { t: 'out_report', on: true });
    [['Lena', 'pink'], ['Max', null], ['Oma', 'tuerkis']].forEach(([n, c]) => { const q = addPhone(n); send(q, { t: 'join_play', name: n, color: c }); });
    p.ui.toast = null;
  } else if (id === 'werkstatt') {
    const p = addPhone('Papa'); send(p, { t: 'admin_login', pw: S.ownerPw }); p.ui.tab = 'mehr'; p.ui.stacks.mehr = ['owner', 'o:ws'];
  }
  activePhone = PH[0] || null;
  broadcastState(); PH.forEach(p => renderPhone(p, true)); updateSimUi(); updateMbar(); renderLog();
}

/* ---------- Takt ---------- */
S = newState();
let lastReal = realNow();
setInterval(() => {
  const r = realNow(); const d = Math.min(300, r - lastReal); lastReal = r;
  let sd = d * CLOCK.warp;
  while (sd > 0) { const st = Math.min(100, sd); CLOCK.t += st; tick(st); sd -= st; }
  for (const P of PH) if (P.connected && P.view === 'app' && P.snap && !P.snap.setupDone && !P.snap.setup) recv(P.token, { t: 'setup_begin' });
  broadcastState();
  for (const P of PH) {
    const h = P.hold;
    if (h && !h.dead && !h.fired && realNow() - h.start >= h.ms) { h.fired = true; holdFire(P, h); }
    if (h && h.dead && h.started && realNow() - h.hb > 200 && P.connected) { h.hb = realNow(); recv(P.token, { t: 'probe_hb' }); }
    if (P.connected && P.snap && P.snap.setupDone) {
      const s = P.snap, r = roleOf(P);
      const wantWs = r.admin && P.ui.tab === 'mehr' && topPage(P) === 'o:ws';
      const mineTm = s.testMode && s.testMode.by === P.token ? s.testMode.kind : null;
      if (wantWs && mineTm !== 'workshop' && !inRoundS(s) && !(s.testMode && !mineTm) && !P.wsTried) { P.wsTried = true; recv(P.token, { t: 'test_mode', on: true, kind: 'workshop' }); }
      if (!wantWs) P.wsTried = false;
      if (mineTm === 'workshop' && !wantWs) recv(P.token, { t: 'test_mode', on: false });
      if (mineTm === 'probe' && !(P.ui.tab === 'modi' && (topPage(P).startsWith('detail:') || topPage(P) === 'ed:probe'))) recv(P.token, { t: 'test_mode', on: false });
    }
    renderPhone(P); renderCtl(P);
  }
  updateSimUi(); updateMbar();
}, 100);
let lastFrame = realNow();
(function frame() {
  const r = realNow(), d = Math.min(100, r - lastFrame); lastFrame = r;
  for (const P of PH) live(P, d);
  drawTop(d);
  requestAnimationFrame(frame);
})();
scenario('familie');
</script>
