<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Louie Prototyp</title>
<!-- Klickbarer Prototyp des Web-UI (V1-Auswahl aus docs/ideen.md).
     Eine Datei, keine externen Abhängigkeiten: so wird das echte UI auch im Hotspot ausgeliefert.
     Der Louie, der Hebel und die Mitspieler sind simuliert (Leiste "Simulation"). -->
<style>
:root {
  --bg: #eef4fa; --surface: #ffffff; --surface-2: #f4f7fb; --text: #18222e; --muted: #5b6878;
  --line: #d8e0ea; --accent: #2f6fdb; --accent-ink: #ffffff; --danger: #d63a2f; --warn: #d98a00; --ok: #1f9d55;
  --sky: #cfe3fb; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 6px 20px rgba(20,30,50,.08);
  --c-rot: #e0443a; --c-gelb: #f2b705; --c-gruen: #2fa65a; --c-lila: #8a4fd1;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141b; --surface: #17202b; --surface-2: #1e2935; --text: #e8eef5; --muted: #95a3b4;
    --line: #2b3847; --accent: #5b93f0; --accent-ink: #0b1220; --danger: #f0645a; --warn: #f2a93b; --ok: #3cc477;
    --sky: #1b2a3c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #17202b; --surface-2: #1e2935; --text: #e8eef5; --muted: #95a3b4;
  --line: #2b3847; --accent: #5b93f0; --accent-ink: #0b1220; --danger: #f0645a; --warn: #f2a93b; --ok: #3cc477;
  --sky: #1b2a3c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.wrap { display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 16px; flex-wrap: wrap; }
.phone {
  width: 100%; max-width: 400px; min-height: 720px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 28px; overflow: hidden; position: relative;
  box-shadow: var(--shadow); display: flex; flex-direction: column;
}
@media (max-width: 460px) { .wrap { padding: 0; gap: 12px; } .phone { border-radius: 0; border: 0; box-shadow: none; min-height: 100vh; } }

/* Kopfzeile */
.top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; letter-spacing: -.01em; flex: 1; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.dot.weak { background: var(--warn); } .dot.lost { background: var(--danger); }
.iconbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; }
.banner { padding: 10px 16px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.banner.warn { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); }
.banner.lost { background: color-mix(in srgb, var(--danger) 18%, var(--surface)); }

main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 4px; font-size: 18px; }
.card h3 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; }
.grow { flex: 1; }
.btn {
  border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 14px;
  min-height: 52px; padding: 0 18px; cursor: pointer; width: 100%; font-size: 17px;
}
.btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.small { min-height: 40px; font-size: 15px; width: auto; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Status mit Louie-Animation */
.stage { display: flex; gap: 14px; align-items: center; }
.sky { width: 108px; height: 108px; border-radius: 50%; background: var(--sky); position: relative; flex: none; }
.sky .mast { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--muted); }
.sky .arm { position: absolute; inset: 0; transform-origin: 50% 50%; }
.sky .plane { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); font-size: 26px; line-height: 1; }
.sky .plane svg { display: block; }
.status-title { font-size: 20px; font-weight: 800; line-height: 1.2; }

/* Hebel-Spiegel */
.lever { width: 56px; height: 30px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex: none; }
.lever::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.lever.on::after { transform: translateX(26px); background: var(--ok); }
.lever.wiggle { animation: wiggle .5s infinite; }
@keyframes wiggle { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

/* Hühner */
.chickens { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.chick {
  border: 2px solid var(--line); background: var(--surface); border-radius: 16px; min-height: 92px; padding: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; position: relative;
}
.chick .em { font-size: 34px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; }
.chick.taken { cursor: default; opacity: .8; }
.chick.me { border-color: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); }
.chick .who { font-weight: 700; font-size: 14px; color: var(--text); }
.chick .free { font-size: 13px; color: var(--muted); }
.chick.out { filter: grayscale(1); opacity: .55; }
.crown { position: absolute; top: 6px; right: 8px; font-size: 16px; }

/* Schieberegler */
input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
.scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 14px; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; border-radius: 10px; min-height: 42px; cursor: pointer; font-weight: 600; }
.seg button.on { background: var(--surface); box-shadow: var(--shadow); }
.modes { display: grid; gap: 8px; }
.mode { display: flex; gap: 12px; align-items: center; padding: 12px; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; background: var(--surface); }
.mode.on { border-color: var(--accent); }
.mode .ic { font-size: 26px; }

/* Gamepad */
.pad { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 4px; }
.speed { width: 100%; }
.speedbar { height: 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; position: relative; }
.speedbar i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); border-radius: 999px; transition: width .15s linear; }
.speedbar i.rev { background: var(--danger); }
.big {
  width: 230px; height: 230px; border-radius: 50%; border: 0; cursor: pointer; position: relative; user-select: none; -webkit-user-select: none; touch-action: none;
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--danger) 70%, #fff) 0%, var(--danger) 62%);
  color: #fff; box-shadow: 0 10px 30px color-mix(in srgb, var(--danger) 40%, transparent), inset 0 -6px 0 rgba(0,0,0,.15);
  display: grid; place-items: center; text-align: center;
}
.big.boost { background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--accent) 65%, #fff) 0%, var(--accent) 62%); box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 40%, transparent), inset 0 -6px 0 rgba(0,0,0,.15); }
.big:disabled { filter: grayscale(.9); opacity: .55; cursor: not-allowed; }
.big:active:not(:disabled) { transform: scale(.97); }
.big .lbl { font-size: 26px; font-weight: 900; letter-spacing: .02em; }
.big .sub { font-size: 14px; opacity: .9; margin-top: 2px; }
.big svg.ring { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); transform: rotate(-90deg); pointer-events: none; }
.tokens { display: flex; gap: 8px; justify-content: center; }
.tokens i { width: 14px; height: 14px; border-radius: 50%; background: var(--danger); }
.tokens i.used { background: var(--line); }
.ticker { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.tick { font-size: 14px; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); animation: pop .3s ease; }
@keyframes pop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Overlays */
.edge { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 0 var(--danger); transition: box-shadow .1s; z-index: 5; }
.edge.on { box-shadow: inset 0 0 0 10px var(--danger); animation: blink .25s infinite alternate; }
@keyframes blink { to { box-shadow: inset 0 0 0 4px var(--danger); } }
.overlay { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(3px); z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
.count { font-size: 140px; font-weight: 900; line-height: 1; animation: zoom .9s ease-out; }
@keyframes zoom { from { transform: scale(1.8); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top-left-radius: 22px; border-top-right-radius: 22px; padding: 18px 16px 22px; z-index: 7; box-shadow: 0 -10px 30px rgba(0,0,0,.15); display: flex; flex-direction: column; gap: 12px; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.3); z-index: 6; }

/* Portal */
.portal { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px 20px; justify-content: center; text-align: center; }
.steps { text-align: left; display: grid; gap: 10px; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 14px; }
.hand { display: inline-block; animation: tap 1.2s infinite; }
@keyframes tap { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

/* Admin */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { border: 2px solid var(--line); border-radius: 14px; padding: 12px 6px; text-align: center; cursor: pointer; background: var(--surface); }
.tile.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.tile .ic { font-size: 28px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--muted); }
.field { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); padding: 0 12px; font: inherit; }
.list { display: grid; gap: 6px; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.tabs { display: flex; gap: 6px; overflow-x: auto; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Simulation */
.sim { width: 100%; max-width: 320px; border: 2px dashed var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.sim h4 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sim .btn { min-height: 42px; font-size: 15px; }
.sim .lever { width: 72px; height: 38px; cursor: pointer; }
.sim .lever::after { width: 30px; height: 30px; }
.sim .lever.on::after { transform: translateX(34px); }
@media (max-width: 460px) { .sim { max-width: none; border-radius: 0; border-left: 0; border-right: 0; } }
.hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone">
    <div id="app" style="display:flex;flex-direction:column;flex:1;position:relative"></div>
  </div>

  <aside class="sim" aria-label="Simulation">
    <h4>Simulation (nicht Teil des UI)</h4>
    <div class="row">
      <div class="lever" id="simLever" role="switch" aria-label="Original-Hebel" tabindex="0"></div>
      <div class="grow"><b>Original-Hebel</b><div class="small muted" id="simLeverTxt">aus</div></div>
    </div>
    <button class="btn secondary" id="simBot">Mitspieler spult zurück</button>
    <button class="btn secondary" id="simOut">Mitspieler scheidet aus</button>
    <button class="btn secondary" id="simBlock">Finger im Arm (Blockieren)</button>
    <button class="btn secondary" id="simConn">Verbindung: gut</button>
    <button class="btn secondary" id="simBatt">Akku: 82 %</button>
    <button class="btn secondary" id="simWake">Aufwecken mit Hebel auf „an“</button>
    <button class="btn secondary" id="simReset">Von vorn (Hotspot-Portal)</button>
    <div class="small muted">Demo-Admin-Passwort: <b>louie</b></div>
  </aside>
</div>

<script>
(() => {
'use strict';

// ---------- Daten ----------
const SEATS = [
  { key: 'rot',   name: 'Rot',   color: 'var(--c-rot)' },
  { key: 'gelb',  name: 'Gelb',  color: 'var(--c-gelb)' },
  { key: 'gruen', name: 'Grün',  color: 'var(--c-gruen)' },
  { key: 'lila',  name: 'Lila',  color: 'var(--c-lila)' },
];
const MODES = [
  { id: 'klassisch', icon: '🛩️', name: 'Klassisch plus', desc: 'Gleichmäßig wie das Original' },
  { id: 'druck',     icon: '🍲', name: 'Druckkochtopf',  desc: 'Wird langsam immer schneller' },
  { id: 'wuerfel',   icon: '🎲', name: 'Würfelmotor',    desc: 'Tempo wechselt zufällig' },
];
const PROFILES = {
  kinder:  { icon: '🧸', name: 'Kinder',  cap: 60,  reverse: false, rewinds: 0, fiesMax: 40 },
  familie: { icon: '🏡', name: 'Familie', cap: 85,  reverse: true,  rewinds: 1, fiesMax: 70 },
  party:   { icon: '🎉', name: 'Party',   cap: 100, reverse: true,  rewinds: 2, fiesMax: 100 },
};
const FIES_LABELS = ['Kindergeburtstag', 'Gemütlich', 'Normal', 'Fies', 'Endgegner'];
const NAME_A = ['Flinke', 'Wilde', 'Mutige', 'Freche', 'Schlaue', 'Rasende', 'Tapfere', 'Listige'];
const NAME_B = ['Henne', 'Glucke', 'Feder', 'Küken', 'Pute', 'Wachtel', 'Gans', 'Ente'];
const BOT_NAMES = ['Anna', 'Rudi', 'Mia'];
const REWIND_MS = 800, WARN_MS = 500, LOCK_MS = 8000, HOLD_MS = 350, BOOST_MS = 2000, BOOST_CD = 6000;

// ---------- Zustand ----------
const S = {
  screen: 'portal',        // portal | lobby | game | end | admin
  conn: 'ok', battery: 82,
  lever: false, leverStuck: false,
  phase: 'ready',          // ready | countdown | running | paused | blocked | ended
  mode: 'druck', fies: 50, profile: 'familie',
  seats: SEATS.map(() => null),   // {name, bot, out, rewinds}
  me: null, myName: randomName(), leader: null,
  speed: 0, target: 0, dir: 1, t0: 0, nextRand: 0,
  warnUntil: 0, revUntil: 0, lockUntil: 0, lockBy: null, boostUntil: 0, boostReady: 0,
  ticker: [], winner: null, stats: {},
  admin: false, adminTab: 'profil', wifi: [{ ssid: 'Heimnetz', prio: 1 }, { ssid: 'Oma & Opa', prio: 2 }],
  sheet: null, count: 0,
};
// zwei Mitspieler sitzen schon in der Lobby
S.seats[0] = { name: BOT_NAMES[0], bot: true, out: false, rewinds: 0 };
S.seats[2] = { name: BOT_NAMES[1], bot: true, out: false, rewinds: 0 };

function randomName() { return NAME_A[(Math.random() * NAME_A.length) | 0] + ' ' + NAME_B[(Math.random() * NAME_B.length) | 0]; }
const prof = () => PROFILES[S.profile];
const now = () => performance.now();
const fiesLabel = v => FIES_LABELS[Math.min(4, Math.floor(v / 20.01))];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- Ton (geht auch ohne HTTPS) ----------
let ac = null;
function beep(freq = 880, ms = 120, n = 1) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < n; i++) {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * (ms / 1000) * 1.6;
      o.frequency.value = freq; g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.0001, t + ms / 1000);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + ms / 1000);
    }
  } catch (e) { /* kein Ton verfügbar */ }
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
}

function tick(msg) { S.ticker.unshift({ msg, id: Math.random() }); S.ticker = S.ticker.slice(0, 3); }

// ---------- Spiel-Simulation (später Server) ----------
function startCountdown() {
  if (S.phase !== 'ready' && S.phase !== 'ended') return;
  S.seats.forEach(s => { if (s) { s.out = false; s.rewinds = prof().rewinds; } });
  S.phase = 'countdown'; S.count = 3;
  if (S.screen === 'lobby' || S.screen === 'end') S.screen = 'game';
  S.ticker = []; S.stats = {}; S.winner = null;
  render(); beep(660);
  const step = () => {
    S.count--;
    if (S.count > 0) { beep(660); render(); setTimeout(step, 900); }
    else { S.phase = 'running'; S.t0 = now(); S.nextRand = 0; beep(990, 250); render(); }
  };
  setTimeout(step, 900);
}
function stopRound(reason) {
  if (S.phase === 'running' || S.phase === 'paused' || S.phase === 'countdown') {
    S.phase = 'ready'; S.speed = 0; S.target = 0; S.dir = 1;
    if (reason) tick(reason);
    if (S.screen === 'game') S.screen = 'lobby';
  }
  render();
}
function finishRound() {
  const alive = S.seats.map((s, i) => s && !s.out ? i : -1).filter(i => i >= 0);
  S.winner = alive.length === 1 ? alive[0] : null;
  S.phase = 'ended'; S.speed = 0; S.target = 0;
  if (S.screen === 'game') S.screen = 'end';
  beep(523, 150, 3);
  render();
}

function requestRewind(seat) {
  const t = now(), s = S.seats[seat];
  if (S.phase !== 'running' || !prof().reverse || !s || s.rewinds <= 0 || t < S.lockUntil) return false;
  s.rewinds--; S.lockUntil = t + WARN_MS + REWIND_MS + LOCK_MS; S.lockBy = seat;
  S.warnUntil = t + WARN_MS; S.revUntil = t + WARN_MS + REWIND_MS;
  S.stats[seat] = (S.stats[seat] || 0) + 1;
  tick(`⏪ <b>${esc(s.name)}</b> spult zurück!`);
  beep(1200, 90, 2);
  return true;
}
function requestBoost(seat) {
  const t = now();
  if (S.phase !== 'running' || t < S.boostReady) return false;
  S.boostUntil = t + BOOST_MS; S.boostReady = t + BOOST_CD;
  tick(`⚡ <b>${esc(S.seats[seat].name)}</b> (Geist) gibt Turbo!`);
  return true;
}
function markOut(seat, by) {
  const s = S.seats[seat]; if (!s || s.out || S.phase !== 'running') return;
  s.out = true;
  tick(`🐔 <b>${esc(s.name)}</b> ist raus${by ? ' (vom Spielleiter markiert)' : ''}. Jetzt als Geist dabei.`);
  const alive = S.seats.filter(x => x && !x.out).length;
  if (alive <= 1) setTimeout(finishRound, 600); else render();
}

function modeTarget(t) {
  const f = S.fies / 100, sec = (t - S.t0) / 1000;
  let v;
  if (S.mode === 'klassisch') v = 45 + 35 * f;
  else if (S.mode === 'druck') v = Math.min(100, 30 + sec * (0.6 + 1.6 * f));
  else {
    if (t > S.nextRand) { S.randV = 25 + Math.random() * (45 + 30 * f); S.nextRand = t + 1500 + Math.random() * (4000 - 2500 * f); }
    v = S.randV || 50;
  }
  return v;
}

let last = now();
function loop() {
  const t = now(), dt = (t - last) / 1000; last = t;
  if (S.phase === 'running') {
    let target = Math.min(modeTarget(t), prof().cap);
    if (t < S.boostUntil) target = Math.min(prof().cap + 15, target + 25);
    // Mini-Ruckler: sehr kurz rückwärts, Häufigkeit über den Fiesheits-Regler
    if (prof().reverse && t > S.lockUntil && Math.random() < dt * 0.04 * (S.fies / 100)) {
      S.lockUntil = t + WARN_MS + 400 + LOCK_MS; S.lockBy = null; S.warnUntil = t + WARN_MS; S.revUntil = t + WARN_MS + 400;
      tick('🌀 Louie zuckt rückwärts!'); beep(1200, 90, 2);
    }
    const wantDir = (t > S.warnUntil && t < S.revUntil) ? -1 : 1;
    if (wantDir === -1) target = 35;
    // Richtungswechsel nur über Null, Rampe begrenzt
    const signed = S.speed * S.dir, goal = target * wantDir, rate = 250 * dt;
    let next = signed + Math.max(-rate, Math.min(rate, goal - signed));
    S.dir = next < 0 ? -1 : 1; S.speed = Math.abs(next); S.target = target;
    // Mitspieler (Bots) spielen ein bisschen mit
    S.seats.forEach((s, i) => {
      if (!s || !s.bot) return;
      if (!s.out && s.rewinds > 0 && Math.random() < dt * 0.05) requestRewind(i);
      if (s.out && Math.random() < dt * 0.08) requestBoost(i);
    });
  } else if (S.phase !== 'paused') {
    S.speed = Math.max(0, S.speed - 200 * dt);
  }
  live();
  requestAnimationFrame(loop);
}

function qrFake(label) {
  let cells = ''; let seed = label.length * 7;
  for (let y = 0; y < 13; y++) for (let x = 0; x < 13; x++) {
    seed = (seed * 9301 + 49297) % 233280;
    const finder = (x < 4 && y < 4) || (x > 8 && y < 4) || (x < 4 && y > 8);
    const on = finder ? (x % 3 === 0 || y % 3 === 0 || (x % 12 > 0 && y % 12 > 0 && (x % 4 === 1 || y % 4 === 1) === false)) : seed / 233280 > .52;
    if (on) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<div style="text-align:center"><svg width="120" height="120" viewBox="-1 -1 15 15" style="background:#fff;border-radius:8px"><g fill="#111">${cells}</g></svg><div class="small"><b>${label}</b></div></div>`;
}

// Werte, die sich ständig ändern, ohne Neuaufbau aktualisieren
function live() {
  const t = now();
  angle = (angle + S.speed * S.dir * 0.06) % 360;
  const arm = document.getElementById('arm'); if (arm) arm.style.transform = `rotate(${angle}deg)`;
  const bar = document.getElementById('spBar');
  if (bar) { bar.style.width = Math.min(100, S.speed) + '%'; bar.classList.toggle('rev', S.dir < 0); }
  const lbl = document.getElementById('spLbl');
  if (lbl) lbl.textContent = S.phase === 'paused' ? 'Pause' : (S.dir < 0 || (t > S.warnUntil && t < S.revUntil)) ? 'Tempo · RÜCKWÄRTS!' : t < S.warnUntil ? 'Achtung, gleich rückwärts!' : t < S.boostUntil ? 'Tempo · TURBO!' : 'Tempo';
  const edge = document.getElementById('edge'); if (edge) edge.classList.toggle('on', t < S.revUntil || (S.dir < 0 && S.speed > 3));
  const tk = document.getElementById('ticker');
  if (tk) { const html = S.ticker.map(x => `<div class="tick" data-id="${x.id}">${x.msg}</div>`).join(''); if (tk.dataset.h !== html) { tk.innerHTML = html; tk.dataset.h = html; } }
  const s = S.me !== null ? S.seats[S.me] : null;
  const btn = document.getElementById('bigBtn'), sub = document.getElementById('bigSub'), ring = document.getElementById('ring');
  if (btn && s) {
    const C = 2 * Math.PI * 122;
    if (!s.out) {
      const locked = t < S.lockUntil, empty = s.rewinds <= 0, off = S.phase !== 'running';
      btn.disabled = locked || empty || off;
      sub.textContent = off ? (S.phase === 'paused' ? 'Pause' : 'wartet auf Start') : empty ? 'aufgebraucht' : locked ? `gesperrt ${Math.ceil((S.lockUntil - t) / 1000)} s` : hold ? 'halten …' : 'gedrückt halten';
      let frac = 0;
      if (hold) frac = Math.min(1, (t - hold) / HOLD_MS);
      else if (locked) frac = 1 - (S.lockUntil - t) / (WARN_MS + REWIND_MS + LOCK_MS);
      ring.setAttribute('stroke-dashoffset', C * (1 - frac));
      ring.setAttribute('stroke', hold ? '#fff' : 'rgba(255,255,255,.55)');
      if (hold && t - hold >= HOLD_MS) { hold = 0; requestRewind(S.me); }
      const tokens = document.getElementById('tokens');
      if (tokens) tokens.innerHTML = Array.from({ length: prof().rewinds }, (_, i) => `<i class="${i < s.rewinds ? '' : 'used'}"></i>`).join('');
    } else {
      const cd = t < S.boostReady;
      btn.disabled = cd || S.phase !== 'running';
      sub.textContent = cd ? `lädt ${Math.ceil((S.boostReady - t) / 1000)} s` : 'antippen';
      ring.setAttribute('stroke-dashoffset', cd ? C * ((S.boostReady - t) / BOOST_CD) : 0);
    }
  }
}

// Halten-zum-Auslösen
let hold = 0;
function bindHold() {
  const b = document.getElementById('bigBtn');
  if (!b || b.dataset.act === 'boost') return;
  const down = e => { e.preventDefault(); if (!b.disabled) { hold = now(); beep(440, 40); } };
  const up = () => { hold = 0; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
}

// ---------- Bedienung ----------
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, i = +el.dataset.i;
  switch (a) {
    case 'openbrowser': S.screen = 'lobby'; break;
    case 'seat':
      if (S.me !== null) S.seats[S.me] = null;
      if (S.leader === S.me && S.me !== null) S.leader = i;
      S.me = i; S.seats[i] = { name: S.myName, bot: false, out: false, rewinds: prof().rewinds }; beep(880, 60); break;
    case 'dice': S.myName = randomName(); if (S.me !== null) S.seats[S.me].name = S.myName; break;
    case 'lead': S.leader = S.me; tick('👑 Du bist Spielleiter.'); break;
    case 'mode': S.mode = el.dataset.id; break;
    case 'invite': S.sheet = 'invite'; break;
    case 'close': S.sheet = null; break;
    case 'boost': requestBoost(S.me); break;
    case 'selfout': if (confirm('Wirklich raus? Dein letzter Chip ist runtergefallen?')) markOut(S.me); break;
    case 'markout': markOut(i, true); break;
    case 'pause': if (S.phase === 'running') { S.phase = 'paused'; S.speed = 0; } else if (S.phase === 'paused') S.phase = 'running'; break;
    case 'estop': S.phase = 'ready'; S.speed = 0; S.target = 0; tick('⛔ Notaus durch den Spielleiter.'); S.screen = 'lobby'; break;
    case 'again': case 'tolobby': S.phase = 'ready'; S.screen = 'lobby'; break;
    case 'admin': S.screen = 'admin'; break;
    case 'back': S.screen = S.phase === 'running' || S.phase === 'paused' ? 'game' : 'lobby'; break;
    case 'login': {
      const pw = document.getElementById('pw').value;
      if (pw === 'louie') { S.admin = true; } else { document.getElementById('pwErr').textContent = 'Falsches Passwort.'; return; }
      break;
    }
    case 'logout': S.admin = false; S.screen = 'lobby'; break;
    case 'tab': S.adminTab = el.dataset.k; break;
    case 'profile': S.profile = el.dataset.k; S.fies = Math.min(S.fies, prof().fiesMax); break;
    case 'addwifi': S.sheet = 'addwifi'; break;
    case 'delwifi': S.wifi.splice(i, 1); break;
    default: return;
  }
  render();
});
app.addEventListener('input', e => {
  const a = e.target.dataset.act;
  if (a === 'fies') { S.fies = +e.target.value; e.target.parentElement.querySelector('.pill').textContent = fiesLabel(S.fies); }
  if (a === 'cap') { prof().cap = +e.target.value; document.getElementById('capLbl').textContent = e.target.value + ' %'; }
});
app.addEventListener('change', e => { if (e.target.dataset.act) render(); });
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pw') app.querySelector('[data-act=login]').click(); });

// ---------- Simulationsleiste ----------
const $ = id => document.getElementById(id);
function setLever(on) {
  S.lever = on;
  if (S.leverStuck) { if (!on) S.leverStuck = false; render(); return; }
  if (S.phase === 'blocked') { if (!on) S.phase = 'ready'; render(); return; }
  if (on) { if (S.screen === 'portal') S.screen = 'lobby'; startCountdown(); }
  else if (S.phase === 'ended') render();
  else stopRound('✋ Hebel aus: Runde gestoppt.');
}
function syncSim() {
  $('simLever').classList.toggle('on', S.lever);
  $('simLeverTxt').textContent = S.lever ? 'an – Motor darf laufen' : 'aus – Motor getrennt';
  $('simConn').textContent = 'Verbindung: ' + { ok: 'gut', weak: 'wackelig', lost: 'getrennt' }[S.conn];
  $('simBatt').textContent = 'Akku: ' + S.battery + ' %';
}
$('simLever').addEventListener('click', () => setLever(!S.lever));
$('simLever').addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setLever(!S.lever); } });
$('simBot').addEventListener('click', () => {
  const bots = S.seats.map((s, i) => s && s.bot && !s.out ? i : -1).filter(i => i >= 0);
  if (!bots.length || !requestRewind(bots[(Math.random() * bots.length) | 0])) tick('ℹ️ Rückspulen gerade nicht möglich (Sperre, Kontingent oder keine Runde).');
  render();
});
$('simOut').addEventListener('click', () => {
  const bots = S.seats.map((s, i) => s && s.bot && !s.out ? i : -1).filter(i => i >= 0);
  if (bots.length) markOut(bots[0]);
});
$('simBlock').addEventListener('click', () => { if (S.phase === 'running') { S.phase = 'blocked'; S.speed = 0; beep(300, 300); if (S.screen === 'lobby') S.screen = 'game'; render(); } });
$('simConn').addEventListener('click', () => { S.conn = { ok: 'weak', weak: 'lost', lost: 'ok' }[S.conn]; render(); });
$('simBatt').addEventListener('click', () => { S.battery = S.battery > 20 ? 18 : 82; render(); });
$('simWake').addEventListener('click', () => { S.phase = 'ready'; S.lever = true; S.leverStuck = true; if (S.screen !== 'portal') S.screen = 'lobby'; render(); });
$('simReset').addEventListener('click', () => location.reload());

render();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
