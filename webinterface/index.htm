
<html>
<head>
<title>ESP8266 LED ON/OFF</title>
<meta http-equiv="refresh" content="5">
<script language="javascript">
function dimSet(evt) {
	var me, he;
    var resp, xmlhttp=new XMLHttpRequest();
	me = evt.target;
	he = document.getElementById(me.id == "dimVal"? "dimSlide":"dimVal"); // need my other value node
    xmlhttp.onreadystatechange=function() {
        if (xmlhttp.readyState==4 && xmlhttp.status==200){
			resp = xmlhttp.responseText;
			console.log(resp);
			he.value = parseInt(resp);
		}
	}
    xmlhttp.open("GET","Val=" + me.value,true); xmlhttp.send()
}
</script>
</head>

<body>
    <h1>ESP8266 LED ON/OFF</h1>
    <center><h2>A simple webserver for turning LED's on and off with Micropython</h2></center>
    <center><h3>(for noobs to both the ESP8266 and Micropython)</h3></center>
    <form>
        Counter: {count}
        LED:
        <button name="LED" value="ON" type="submit">LED ON</button>
        <button name="LED" value="OFF" type="submit">LED OFF</button><br>
        Status: {status}<br>
    </form>
</body>



</html>
