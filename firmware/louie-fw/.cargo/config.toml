[build]
target = "riscv32imac-esp-espidf"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
# --port selects the serial port; on the Waveshare board use the CH343 port (README.md, "Serial ports")
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c6"
# Pinned tag (docs/firmware-architecture.md E7)
ESP_IDF_VERSION = "v5.5.5"
# ESP-IDF and its tools go to ~/.espressif: the repo path contains spaces, which the ESP-IDF build does not
# support inside its own tree (README.md, "Path with spaces")
ESP_IDF_TOOLS_INSTALL_DIR = "global"
