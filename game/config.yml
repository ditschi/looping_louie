gamemodes:
- name: Half Speed
  speed_config:
    type: Constant
    value: 50
  time_config:
    type: None
- name: Max Speed
  speed_config:
    type: Constant
    value: 100
  time_config:
    type: None
- name: Constant increasing speed
  speed_config:
    type: Constant to End
    start: 0
    end: 100
  time_config:
    type: Constant
    value: 5
- name: Random increasing spead
  speed_config:
    type: Random to End
    start: 0
    end: 100
    min_change: 5
    max_change: 5
  time_config:
    type: Constant
    value: 5
- name: Random
  speed_config:
    type: Random
    start: 50
    min: 10
    max: 90
    min_change: 5
    max_change: 5
  time_config:
    type: Random
    min: 2
    max: 5



    "Constant": {"Value"},
    "Constant to End": {"Start", "End"},
    "Random to End": {"Start", "End",  "Minimum Change", "Maximum Change"},
    "Random": {"Start", "Minimum", "Maximum", "Minimum Change", "Maximum Change"},
